name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check retailer refresh recovery
        run: python -m unittest discover -s tests -v
      - name: Restore previous retailer prices
        uses: actions/cache/restore@v5
        with:
          path: .cache/retail-prices.json
          key: retail-prices-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: retail-prices-v1-
      - name: Collect retailer page prices
        timeout-minutes: 12
        run: |
          python scripts/fetch_retail_prices.py --output data/retail-prices.json --previous .cache/retail-prices.json
          mkdir -p .cache
          cp data/retail-prices.json .cache/retail-prices.json
      - name: Save retailer prices for the next refresh
        uses: actions/cache/save@v5
        with:
          path: .cache/retail-prices.json
          key: retail-prices-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Collect Kaohsiung livestock market prices
        run: python scripts/fetch_livestock_prices.py --output data/livestock-prices.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html app.js styles.css favicon.svg _site/
          cp -R data _site/data
      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
