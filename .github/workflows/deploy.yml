name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Collect retailer page prices
        run: python scripts/fetch_retail_prices.py --output data/retail-prices.json
      - name: Collect Kaohsiung livestock market prices
        run: python scripts/fetch_livestock_prices.py --output data/livestock-prices.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
