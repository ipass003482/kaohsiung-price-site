name: Diagnose PXmart public page response

on:
  push:
    branches: [fix/pxmart-auto-refresh]
    paths: [.github/workflows/diagnose-pxmart.yml]

permissions:
  contents: read

jobs:
  inspect-response:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install standard browser automation library
        run: python -m pip install playwright==1.63.0
      - name: Open the normal PXmart shopping entrance
        run: |
          python - <<'PY'
          import json
          import sys
          from playwright.sync_api import sync_playwright
          sys.path.insert(0, "scripts")
          import fetch_retail_prices as retail

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(channel="chrome", headless=True, chromium_sandbox=True)
              page = browser.new_page(locale="zh-TW")
              response = page.goto(retail.PX_BASE + "/hourArrive/", wait_until="domcontentloaded", timeout=45000)
              print(json.dumps({"stage": "entrance", "http_status": response.status if response else None, "title": page.title()}, ensure_ascii=False))
              if response and response.ok:
                  inputs = page.locator("input").all()
                  for field in inputs:
                      placeholder = field.get_attribute("placeholder") or ""
                      if field.is_visible() and ("搜尋" in placeholder or "商品" in placeholder):
                          field.fill("菜")
                          field.press("Enter")
                          page.wait_for_url("**/search/**", timeout=15000)
                          page.wait_for_load_state("domcontentloaded")
                          parser = retail.PxCardParser()
                          parser.feed(page.content())
                          print(json.dumps({"stage": "search", "title": page.title(), "product_cards": len(parser.items), "body_excerpt": page.locator("body").inner_text()[:600]}, ensure_ascii=False))
                          break
                  else:
                      print(json.dumps({"stage": "entrance_inputs", "placeholders": [field.get_attribute("placeholder") for field in inputs]}, ensure_ascii=False))
              browser.close()
          PY
      - name: Read the official public promotion page
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          from urllib.parse import quote
          from urllib.error import HTTPError
          sys.path.insert(0, "scripts")
          import fetch_retail_prices as retail

          url = "https://www.pxmart.com.tw/campaign/life-will/classification/" + quote("鮮魚精肉")
          try:
              html = retail.fetch_html(url)
              matched = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', html, re.S)
              props = json.loads(matched.group(1))["props"]["pageProps"]
              products = [item for category in props["categories"] for item in category["group"]]
              result = {"http_status": 200, "product_count": len(products), "products": [{key: item[key] for key in ("name", "price", "priceRemarks", "startDate", "endDate")} for item in products]}
              print(json.dumps(result, ensure_ascii=False))
          except HTTPError as error:
              print(json.dumps({"http_status": error.code}, ensure_ascii=False))
          PY
