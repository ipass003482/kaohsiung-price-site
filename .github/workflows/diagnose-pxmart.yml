name: Diagnose PXmart public page response

on:
  push:
    branches: [fix/pxmart-auto-refresh]
    paths: [.github/workflows/diagnose-pxmart.yml]

permissions:
  contents: read

jobs:
  inspect-response:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Read the official public promotion page
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          from urllib.parse import quote
          from urllib.error import HTTPError
          sys.path.insert(0, "scripts")
          import fetch_retail_prices as retail

          url = "https://www.pxmart.com.tw/campaign/life-will/classification/" + quote("蔬菜水果")
          try:
              html = retail.fetch_html(url)
              titles = re.findall(r"<h5\b[^>]*>(.*?)</h5>", html, re.S)
              readable = re.sub(r"\s+", " ", re.sub(r"<[^>]*>", " ", html)).strip()
              result = {"http_status": 200, "product_titles": titles[:6], "title_count": len(titles), "has_current_period": "2026-09-18" in html and "2026-10-01" in html}
              print(json.dumps(result, ensure_ascii=False))
          except HTTPError as error:
              print(json.dumps({"http_status": error.code}, ensure_ascii=False))
          PY
