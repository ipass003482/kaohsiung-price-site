name: Diagnose PXmart public page response

on:
  push:
    branches: [fix/pxmart-auto-refresh]
    paths: [.github/workflows/diagnose-pxmart.yml]

permissions:
  contents: read

jobs:
  inspect-response:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install standard browser automation library
        run: python -m pip install playwright
      - name: Inspect one public search page in standard Chrome
        run: |
          python - <<'PY'
          import json
          import sys
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright
          sys.path.insert(0, "scripts")
          import fetch_retail_prices as retail

          url = retail.PX_BASE + "/hourArrive/search/result?" + urlencode({"q": "菜"})
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(channel="chrome", headless=True, chromium_sandbox=True)
              page = browser.new_page(locale="zh-TW")
              response = page.goto(url, wait_until="domcontentloaded", timeout=45000)
              parser = retail.PxCardParser()
              parser.feed(page.content())
              result = {"http_status": response.status if response else None, "title": page.title(), "product_cards": len(parser.items)}
              if not parser.items:
                  result["response_text"] = page.locator("body").inner_text()[:1800]
              print(json.dumps(result, ensure_ascii=False))
              browser.close()
          PY
